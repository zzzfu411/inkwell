[package]
name = "mogao-tauri"
version = "0.19.0"
description = "Inkwell (墨稿) · Rust/Tauri local novel studio"
authors = ["Inkwell contributors"]
edition = "2021"

[lib]
name = "mogao_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time"] }
axum = { version = "0.8", features = ["json", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
walkdir = "2"
once_cell = "1"
thiserror = "2"
anyhow = "1"
open = "5"
url = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
notify = "7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
